name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run rule tests
        run: python -m unittest discover tests
      - name: Good deck must pass
        run: python -m shotlock examples/good_deck.json
      - name: Bad deck must block
        run: |
          if python -m shotlock examples/bad_deck.json; then
            echo "::error::bad_deck.json 应当被拦截（返回非零退出码），但它通过了"
            exit 1
          fi
          echo "OK: bad_deck.json 被正确拦截（含 P0/P1 问题）"
